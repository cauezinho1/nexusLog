<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <title>Nexuslog Gestão Empresarial</title>
</head>
<body>

   <!--Menu Lateral-->
    <aside class="menu-lateral"> 

        <div class="logo">
            <img src="imgs/Logótipo NexusLog Azul em Fundo Transparente.png" alt="logo-empresa">
        </div>
        
        <nav class="menu">
            
            <ul>
                 <li>
            <a href="#" class="ativo">
                <i data-lucide="house"></i>
                <span>Início</span>
            </a>
        </li>

        <li>
            <a href="#" class="ativo">
                <i data-lucide="building-2"></i>
                <span>Empresas</span>
            </a>
        </li>

        <li>
            <a href="#" class="ativo">
                <i data-lucide="circle-plus"></i>
                <span>Cadastrar Empresas</span>
            </a>
        </li>

        <li>
            <a href="#" class="ativo">
                <i data-lucide="settings"></i>
                <span>Configurações</span>
            </a>
        </li>
            </ul>

        </nav>
    </aside>

    <script>
    lucide.createIcons();
    </script>

    <!--Conteudo principal-->

    <main class="conteudo-principal">
        <header class="cabecalho">
            <div>
                <h1>Bem-vindo ao <span> NexusLog</span></h1>
                <p>Gerencie suas empresa de forma simples e eficiente.</p>
            </div>
        </header>

    <!--Cards-->

    <section class="resumo-empresas">
        
        <div class="cards-resumo">
            <div class="card-conteudo"> 
                <div class="card-icone total">
                    <i data-lucide="building-2"></i>
                </div>

                <div class="card-informacoes">
                    <p>Total de empresas</p>
                    <h2>0</h2>
                </div>
            </div>
        </div>

        <div class="cards-resumo">
            <div class="card-conteudo">
                <div class="card-icone ativo">
                    <i data-lucide="circle-check"></i>
                </div>

                <div class="card-informacoes">
                    <p>Empresas ativas</p>
                    <h2>0</h2>
                </div>
            </div>    
        </div>

    <div class="cards-resumo">
        <div class="card-conteudo">
            <div class="card-icone inativo">
                <i data-lucide="x"></i>
            </div>

            <div class="card-informacoes">
                <span>Inativas</span>
                <h2>0</h2>
            </div>
        </div>
    </div>

    </section>

    <!-- cabeçalho -->

    <section class="gestao-empresas">
        <div class="cabecalho-empresas">
             <h2>Lista de empresas</h2>

            <div class="acoes-empresas">
                <div class="campo-pesquisa">
                    <input type="text" placeholder="Buscar por nome, email ou responsável">
                </div>

                <button class="botao-cadastro">
                    Cadastrar empresa
                </button>
                        
            </div>
        </div>
    </section> 
    </main>
</body>
</html>
